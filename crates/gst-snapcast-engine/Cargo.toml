[package]
name = "gst-snapcast-engine"
description = "GStreamer-agnostic glue around snapcast-rs: runtime, lifecycle and shared server/client instances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Embedded Snapcast server (used by snapsink)
server = ["dep:snapcast-server", "dep:mdns-sd", "dep:serde_json"]
# JSON-RPC control API (TCP, HTTP/WebSocket, Snapweb) for the embedded server
control = ["server", "dep:snapcast-control"]
# Embedded Snapcast client (used by snapsrc)
client = ["dep:snapcast-client", "dep:mdns-sd"]

[dependencies]
snapcast-server = { workspace = true, optional = true }
snapcast-client = { workspace = true, optional = true }
snapcast-proto = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
mdns-sd = { workspace = true, optional = true }
snapcast-control = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
