[package]
name = "gst-plugin-snapsink"
description = "GStreamer sink feeding PCM into an embedded Snapcast server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Produces libgstsnapsink.so; GStreamer derives the plugin name "snapsink"
# from the file name and looks up `gst_plugin_snapsink_get_desc`.
name = "gstsnapsink"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
gst = { workspace = true }
gst-snapcast-common = { workspace = true }
gst-base = { workspace = true }
gst-audio = { workspace = true }
gst-snapcast-engine = { workspace = true, features = ["server"] }

[dev-dependencies]
# tests/shared.rs: a daemon in the test process, and a Snapcast client to listen.
gst-snapcast-daemon = { path = "../gst-snapcast-daemon" }
gst-snapcast-engine = { workspace = true, features = ["shared", "client"] }
tokio = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["shared"]
# Feed the user's shared server daemon (gst-snapcast-daemon) in mode auto/shared. Unix.
shared = ["gst-snapcast-engine/shared"]
# The JSON-RPC control API and Snapweb in mode embedded (the daemon always has them).
# Pulls in an HTTP stack and authentication crates; off by default.
control = ["gst-snapcast-engine/control"]

[build-dependencies]
gst-plugin-version-helper = { workspace = true }

[lints]
workspace = true
